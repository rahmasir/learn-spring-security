<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Guest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-emerald-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-lg bg-white p-10 rounded-2xl shadow-2xl text-center">
    <h1 class="text-4xl font-bold text-emerald-800 mb-4">Welcome, Guest!</h1>
    <p class="text-emerald-600 text-lg mb-6">You are viewing the public page, accessible to everyone.</p>
    <a th:href="@{/login}" class="inline-block bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-6 rounded-lg transition duration-300">
        Login
    </a>
    <div class="mt-8 border-t border-emerald-200 pt-6">
        <p class="text-emerald-500 italic">"A stranger is just a friend you haven't met yet."</p>
    </div>
</div>

</body>
</html>
