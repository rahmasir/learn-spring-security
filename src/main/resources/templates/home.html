<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Guest!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Header -->
<header class="bg-white shadow-md">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold text-gray-900">
            MyApp
        </div>
        <div>
            <!-- In a real app, you would use th:href="@{/login}" -->
            <a href="#" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                Login
            </a>
        </div>
    </nav>
</header>

<!-- Main Content -->
<main class="container mx-auto px-6 py-12">
    <div class="bg-white p-8 rounded-2xl shadow-lg text-center">
        <h1 class="text-4xl font-bold text-gray-900 mb-4">Welcome to Our Application!</h1>
        <p class="text-lg text-gray-600 mb-6">
            This is the public homepage, accessible to everyone. Please log in to access user-specific features.
        </p>
        <div class="mt-8">
            <img src="https://placehold.co/600x400/E2E8F0/4A5568?text=Public+Content"
                 alt="Public Content Placeholder"
                 class="mx-auto rounded-lg shadow-md">
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-white mt-12 py-6">
    <div class="container mx-auto px-6 text-center text-gray-500">
        <p>&copy; 2025 MyApp. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
