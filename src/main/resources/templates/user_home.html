<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Header -->
<header class="bg-white shadow-md">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold text-gray-900">
            MyApp - User Panel
        </div>
        <div>
            <!-- In a real app, you would use th:href="@{/logout}" -->
            <a href="#" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                Logout
            </a>
        </div>
    </nav>
</header>

<!-- Main Content -->
<main class="container mx-auto px-6 py-12">
    <div class="bg-white p-8 rounded-2xl shadow-lg">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">
            User Dashboard
        </h1>
        <!-- Using Spring Security Dialect to show username -->
        <p class="text-xl text-gray-600 mb-6">
            Welcome back, <span sec:authentication="name" class="font-semibold text-blue-600">Username</span>!
        </p>

        <div class="border-t border-gray-200 pt-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Your Content</h2>
            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-gray-50 p-6 rounded-lg">
                    <h3 class="font-bold text-lg mb-2">My Profile</h3>
                    <p class="text-gray-600">View and edit your personal information.</p>
                </div>
                <div class="bg-gray-50 p-6 rounded-lg">
                    <h3 class="font-bold text-lg mb-2">My Settings</h3>
                    <p class="text-gray-600">Manage your account settings and preferences.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-white mt-12 py-6">
    <div class="container mx-auto px-6 text-center text-gray-500">
        <p>&copy; 2025 MyApp. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
