<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-2xl text-center">
    <h1 class="text-4xl font-bold text-slate-800 mb-6">Navigation Hub</h1>
    <p class="text-slate-600 mb-8">Please select a destination to continue.</p>

    <div class="space-y-4">
        <a th:href="@{/home}" class="block w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
            Guest Homepage
        </a>
        <a th:href="@{/user/home}" class="block w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
            User Homepage
        </a>
        <a th:href="@{/admin/home}" class="block w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
            Admin Homepage
        </a>
    </div>

    <div class="mt-10 border-t border-slate-200 pt-6">
        <p class="text-slate-500 italic">"The journey of a thousand miles begins with a single step."</p>
    </div>
</div>

</body>
</html>
